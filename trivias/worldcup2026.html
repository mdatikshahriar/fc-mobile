<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 FIFA World Cup Squads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-bottom: 3px solid #00ff88; /* World Cup Green */
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span { color: #ee1c25; /* La Liga Red */ }
    .logo .season { font-size: 14px; color: #888; font-weight: 400; margin-left: 5px; }

    .search-wrap {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      border-radius: 12px;
      border: 1px solid #333;
      font-size: 16px;
      background: #000;
      color: #fff;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-wrap input::placeholder { color: #666; }
    .search-wrap input:focus { 
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .search-wrap .icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #ffdf00;
      pointer-events: none;
      font-size: 22px; color: #fff; text-transform: uppercase; text-shadow: 0 0 2px rgba(255,255,255,0.3);
    }

    .meta {
      padding: 20px 32px;
      font-size: 14px;
      color: #999;
    }

    .meta strong { color: #ffdf00; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 32px 40px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #2a2a2a;
      transition: all 0.3s ease;
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: transparent;
      transition: background 0.3s ease;
    }

    .card:hover {
      border-color: #00ff88;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card:hover::before {
      background: #00ff88;
    }

    .info { flex: 1; min-width: 0; }

    .player-name {
      font-size: 22px; color: #fff; text-transform: uppercase; text-shadow: 0 0 2px rgba(255,255,255,0.3);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      color: #fff;
    }

    .number-position {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #aaa;
    }

    .number {
      font-weight: 900;
      color: #00ff88; /* Highlighted Jersey Number */ font-size: 18px; text-shadow: 0 0 5px rgba(0,255,136,0.5);
      background: rgba(0, 255, 136, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 16px;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .club-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 100px 0;
      color: #666;
      font-size: 22px; color: #fff; text-transform: uppercase; text-shadow: 0 0 2px rgba(255,255,255,0.3);
    }

    /* Animation for cards */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeIn 0.4s ease forwards;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

function normalizeStr(str) {
  if (!str) return '';
  return str.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function getClubColor(clubName) {
  let hash = 0;
  for (let i = 0; i < clubName.length; i++) {
    hash = clubName.charCodeAt(i) + ((hash << 5) - hash);
  }
  return `hsl(${Math.abs(hash) % 360}, 70%, 50%)`;
}

  "Haiti": "🇭🇹", "Iran": "🇮🇷", "Iraq": "🇮🇶", "Ivory Coast": "🇨🇮",
  "Japan": "🇯🇵", "Jordan": "🇯🇴", "Mexico": "🇲🇽", "Morocco": "🇲🇦",
  "Netherlands": "🇳🇱", "New Zealand": "🇳🇿", "Norway": "🇳🇴", "Panama": "🇵🇦",
  "Paraguay": "🇵🇾", "Portugal": "🇵🇹", "Qatar": "🇶🇦", "Saudi Arabia": "🇸🇦",
  "Scotland": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "Senegal": "🇸🇳", "South Africa": "🇿🇦", "South Korea": "🇰🇷",
  "Spain": "🇪🇸", "Sweden": "🇸🇪", "Switzerland": "🇨🇭", "Tunisia": "🇹🇳",
  "Turkey": "🇹🇷", "United States": "🇺🇸", "Uruguay": "🇺🇾", "Uzbekistan": "🇺🇿"
};

function render(players, query) {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = players.length;
  
  if (players.length === 0) {
    grid.innerHTML = `<div class="empty">No players found for "<strong>${query}</strong>"</div>`;
    return;
  }

  grid.innerHTML = players.map(p => `
    <div class="card">
      <div class="info">
        <div class="player-name">${p.name}</div>
        <div class="number-position">
          <span class="number">#${p.number}</span>
          <span>${p.position}</span>
        </div>
      </div>
      <span class="club-badge" style="border-left: 4px solid ${getClubColor(p.team)}">${FLAGS[p.team] || ''} ${p.team}</span>
    </div>
  `).join('');
}

PLAYERS.sort((a, b) => a.team.localeCompare(b.team) || parseInt(a.number) - parseInt(b.number));

render(PLAYERS, '');

document.getElementById('searchInput').addEventListener('input', function() {
  const val = this.value.trim();
  const q = normalizeStr(val);
  
  if (!q) {
    document.getElementById('meta').innerHTML = 'Showing all <strong id="count">0</strong> players';
    render(PLAYERS, '');
    return;
  }
  
  const filtered = PLAYERS.filter(p =>
    normalizeStr(p.name).includes(q) ||
    normalizeStr(p.team).includes(q) ||
    normalizeStr(p.position).includes(q) ||
    normalizeStr(p.number) === q
  );
  
  document.getElementById('meta').innerHTML = `Found <strong id="count">0</strong> players for "<em>${val}</em>"`;
  render(filtered, val);
});
</script>
