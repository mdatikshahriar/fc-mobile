<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serie A Player Directory 2025/26</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #020514 0%, #070e2c 100%);
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: rgba(9, 14, 41, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid #d4af37; /* Gold accent */
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #007aff, #d4af37);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff 60%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text .season {
      font-size: 13px;
      color: #a0aec0;
      font-weight: 400;
      margin-left: 6px;
      -webkit-text-fill-color: #a0aec0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      max-width: 850px;
      justify-content: flex-end;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 15px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-wrap input:focus {
      border-color: #d4af37;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .search-wrap .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4af37;
      pointer-events: none;
      font-size: 16px;
    }

    .filter-select {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(9, 14, 41, 0.95);
      color: #f3f4f6;
      outline: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-select:focus, .filter-select:hover {
      border-color: #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .meta-bar {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #a0aec0;
    }

    .meta-bar strong {
      color: #d4af37;
      font-weight: 600;
    }

    .pos-tabs {
      display: flex;
      gap: 8px;
    }

    .pos-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #a0aec0;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pos-tab:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .pos-tab.active {
      background: #d4af37;
      color: #020514;
      border-color: #d4af37;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }

    /* Distinguished position-specific active filter tab styles */
    .pos-tab[data-pos="Goalkeeper"].active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }
    .pos-tab[data-pos="Defender"].active {
      background: #059669;
      color: #fff;
      border-color: #059669;
      box-shadow: 0 0 12px rgba(5, 150, 105, 0.4);
    }
    .pos-tab[data-pos="Midfielder"].active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.4);
    }
    .pos-tab[data-pos="Attack"].active {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 32px 60px;
    }

    .card {
      background: rgba(15, 22, 56, 0.4);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Position colored indicator top bars (always visible to distinguish positions) */
    .card.GK::before { background: #2563eb; }
    .card.DF::before { background: #059669; }
    .card.MF::before { background: #d97706; }
    .card.FW::before { background: #dc2626; }

    /* Expand indicator top bar slightly on hover */
    .card:hover::before {
      height: 8px;
    }

    .card:hover {
      transform: translateY(-5px);
      background: rgba(15, 22, 56, 0.65);
    }

    /* Position-colored glow and border highlighting on hover */
    .card.GK:hover {
      border-color: rgba(37, 99, 235, 0.5);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
    }
    .card.DF:hover {
      border-color: rgba(5, 150, 105, 0.5);
      box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25);
    }
    .card.MF:hover {
      border-color: rgba(217, 119, 6, 0.5);
      box-shadow: 0 12px 30px rgba(217, 119, 6, 0.25);
    }
    .card.FW:hover {
      border-color: rgba(220, 38, 38, 0.5);
      box-shadow: 0 12px 30px rgba(220, 38, 38, 0.25);
    }

    .player-header {
      display: flex;
      gap: 16px;
      align-items: center;
    }


    .player-title {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .player-name .highlight {
      background: rgba(212, 175, 55, 0.3);
      color: #fff;
      border-radius: 2px;
      padding: 0 2px;
      font-weight: 800;
    }

    .player-sub {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .jersey-number {
      font-size: 13px;
      font-weight: 800;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .position-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .badge-Goalkeeper { background: rgba(37, 99, 235, 0.25); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.5); }
    .badge-Defender   { background: rgba(5, 150, 105, 0.25); color: #34d399; border: 1px solid rgba(5, 150, 105, 0.5); }
    .badge-Midfielder { background: rgba(217, 119, 6, 0.25); color: #fbbf24; border: 1px solid rgba(217, 119, 6, 0.5); }
    .badge-Attack     { background: rgba(220, 38, 38, 0.25); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.5); }

    .player-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      font-size: 13px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      color: #a0aec0;
    }

    .detail-value {
      color: #e2e8f0;
      font-weight: 500;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-value {
      color: #d4af37; /* Highlighted Gold */
      font-weight: 700;
    }

    .flag-icon {
      width: 18px;
      height: 12px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 100px 0;
      color: #a0aec0;
      font-size: 18px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #020514;
    }
    ::-webkit-scrollbar-thumb {
      background: #0f1638;
      border-radius: 5px;
      border: 2px solid #020514;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }

    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: stretch;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrap {
        max-width: none;
      }
      .meta-bar {
        padding: 16px 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .grid {
        padding: 0 20px 40px;
      }
    }
  </style>
</head>

</div>

<div class="grid" id="grid"></div>

// Populate team filter dropdown
const teams = [...new Set(PLAYERS.map(p => p.team))].sort();
const teamFilter = document.getElementById('teamFilter');
teams.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t;
  opt.textContent = t;
  teamFilter.appendChild(opt);
});

function normalizeStr(str) {
  if (!str) return '';
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function getPosClass(pos) {
  if (pos === 'Goalkeeper') return 'GK';
  if (pos === 'Defender') return 'DF';
  if (pos === 'Midfielder') return 'MF';
  if (pos === 'Attack') return 'FW';
  return '';
}

function highlight(text, query) {
  if (!query || !text) return text;
  
  // Find match location diacritic-insensitively
  const normText = normalizeStr(text);
  const normQuery = normalizeStr(query);
  const index = normText.indexOf(normQuery);
  
  if (index === -1) return text;
  
  const originalMatch = text.substr(index, query.length);
  return text.substring(0, index) + 
         `<span class="highlight">${originalMatch}</span>` + 
         text.substring(index + query.length);
}

function render(list, query) {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = list.length;
  
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">No players found matching your criteria.</div>`;
    return;
  }
  
  grid.innerHTML = list.map(p => {
    const flagHtml = p.countryCode ? 
      `<img class="flag-icon" src="${getFlagUrl(p.countryCode)}" alt="${p.country}" onerror="this.style.display='none'">` : '';
      
    return `
      <div class="card ${getPosClass(p.position)}">
        <div class="player-header">
          <div class="player-title">
            <div class="player-name">${highlight(p.name, query)}</div>
            <div class="player-sub">
              ${p.number ? `<span class="jersey-number">#${p.number}</span>` : ''}
              <span class="position-badge badge-${p.position}">${p.position}</span>
            </div>
          </div>
        </div>
        
        <div class="player-details">
          <div class="detail-row">
            <span class="detail-label">Club</span>
            <span class="detail-value team-value">${highlight(p.team, query)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Nationality</span>
            <span class="detail-value">${flagHtml} ${highlight(p.country, query)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

let activePos = '';

function filterAndRender() {
  const query = document.getElementById('searchInput').value.trim();
  const qNorm = normalizeStr(query);
  const selectedTeam = teamFilter.value;
  
  const filtered = PLAYERS.filter(p => {
    // Search input match
    const matchesSearch = !qNorm || 
      normalizeStr(p.name).includes(qNorm) || 
      normalizeStr(p.team).includes(qNorm) || 
      normalizeStr(p.country).includes(qNorm) ||
      normalizeStr(p.position).includes(qNorm);
      
    // Position filter match
    const matchesPos = !activePos || p.position === activePos;
    
    // Team filter match
    const matchesTeam = !selectedTeam || p.team === selectedTeam;
    
    return matchesSearch && matchesPos && matchesTeam;
  });
  
  // Update meta text description
  const metaText = document.getElementById('metaText');
  let filterDesc = '';
  if (selectedTeam) filterDesc += ` in <strong>${selectedTeam}</strong>`;
  if (activePos) filterDesc += ` playing as <strong>${activePos}s</strong>`;
  
  if (qNorm) {
    metaText.innerHTML = `Found <strong id="count">${filtered.length}</strong> players for "<em>${query}</em>"${filterDesc}`;
  } else {
    metaText.innerHTML = `Showing <strong id="count">${filtered.length}</strong> players${filterDesc}`;
  }
  
  render(filtered, query);
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', filterAndRender);
teamFilter.addEventListener('change', filterAndRender);

document.querySelectorAll('.pos-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.pos-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    activePos = this.getAttribute('data-pos');
    filterAndRender();
  });
});

// Initial render
filterAndRender();
