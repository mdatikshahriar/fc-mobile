<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga Player Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
    }

    header {
      background: #d20515;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(210,5,21,0.5);
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
    }

    .logo span { color: #ffcc00; }

    .search-wrap {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 42px 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      outline: none;
      transition: background 0.2s;
    }

    .search-wrap input::placeholder { color: rgba(255,255,255,0.6); }
    .search-wrap input:focus { background: rgba(255,255,255,0.25); }

    .search-wrap .icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.6);
      pointer-events: none;
      font-size: 16px;
    }

    .meta {
      padding: 16px 24px;
      font-size: 13px;
      color: #888;
    }

    .meta strong { color: #ccc; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      padding: 0 24px 40px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #2a2a2a;
      transition: border-color 0.2s, transform 0.15s;
      cursor: default;
    }

    .card:hover {
      border-color: #d20515;
      transform: translateY(-2px);
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
    }

    .info { flex: 1; min-width: 0; }

    .player-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-name .first { font-weight: 400; color: #bbb; }
    .player-name .last { color: #fff; }

    .number {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .team {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .position-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 5px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pos-Goalkeeper { background: #1d4ed8; color: #93c5fd; }
    .pos-Defender   { background: #166534; color: #86efac; }
    .pos-Midfielder { background: #78350f; color: #fcd34d; }
    .pos-Forward    { background: #7f1d1d; color: #fca5a5; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: #555;
      font-size: 16px;
    }

    .highlight { color: #ffcc00; font-weight: 700; }
  </style>
</head>

</header>

const placeholder = '/assets/placeholder/player-circle-default.png';

function posClass(p) {
  return 'pos-' + p.replace(/\s+/g, '');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark class="highlight">$1</mark>');
}

function render(players, query) {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = players.length;
  
  if (players.length === 0) {
    grid.innerHTML = '<div class="empty">No players found for "<strong>' + query + '</strong>"</div>';
    return;
  }

  grid.innerHTML = players.map(p => {
    const imgSrc = p.img || placeholder;
    const displayName = (p.firstName ? '<span class="first">' + highlight(p.firstName, query) + '</span> ' : '') +
                        '<span class="last">' + highlight(p.lastName || p.name, query) + '</span>';
    return `
      <div class="card">
        <img class="avatar" src="${imgSrc}" alt="${p.name}" 
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><circle cx=%2228%22 cy=%2228%22 r=%2228%22 fill=%22%232a2a2a%22/></svg>'">
        <div class="info">
          <div class="player-name">${displayName}</div>
          ${p.number ? '<div class="number">#' + p.number + '</div>' : ''}
          <div class="team">${highlight(p.team, query)}</div>
          <span class="position-badge ${posClass(p.position)}">${highlight(p.position, query)}</span>
        </div>
      </div>`;
  }).join('');
}

render(PLAYERS, '');

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) {
    document.getElementById('meta').innerHTML = 'Showing all <strong id="count">0</strong> players';
    render(PLAYERS, '');
    return;
  }
  const filtered = PLAYERS.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.team.toLowerCase().includes(q) ||
    p.position.toLowerCase().includes(q)
  );
  document.getElementById('meta').innerHTML = `Found <strong id="count">0</strong> players for "<em>${this.value}</em>"`;
  render(filtered, this.value.trim());
});
</script>
