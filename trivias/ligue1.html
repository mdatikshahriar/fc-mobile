<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligue 1 Player Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0c10;
      color: #c5c6c7;
      min-height: 100vh;
    }

    header {
      background: #1f2833;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border-bottom: 2px solid #66fcf1;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      text-transform: uppercase;
    }

    .logo span { color: #66fcf1; }

    .search-wrap {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 48px 12px 20px;
      border-radius: 12px;
      border: 1px solid #45a29e;
      font-size: 16px;
      background: #0b0c10;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-wrap input::placeholder { color: #888; }
    .search-wrap input:focus { 
      background: #12141a; 
      border-color: #66fcf1;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
    }

    .search-wrap .icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #45a29e;
      pointer-events: none;
      font-size: 18px;
    }

    .meta {
      padding: 20px 32px;
      font-size: 14px;
      color: #888;
    }

    .meta strong { color: #66fcf1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 0 32px 40px;
    }

    .card {
      background: #1f2833;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #333;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: default;
    }

    .card:hover {
      border-color: #66fcf1;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .info { flex: 1; min-width: 0; }

    .player-name {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: #fff;
    }

    .player-name .first { font-weight: 400; color: #a0a0a0; }

    .number-position {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }

    .number {
      font-weight: 700;
      color: #66fcf1;
    }

    .club-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: flex-start;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
      color: #666;
      font-size: 18px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

</header>

// Helper to generate a consistent color based on the club's name
function getClubColor(clubName) {
  let hash = 0;
  for (let i = 0; i < clubName.length; i++) {
    hash = clubName.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  // Use a vibrant hsl color with good contrast against dark background
  return `hsl(${hue}, 80%, 30%)`;
}

function normalizeStr(str) {
  if (!str) return '';
  // Convert to NFD (Normalization Form Canonical Decomposition)
  // which separates base letters from their combining diacritical marks.
  // Then remove the diacritical marks and lowercase.
  return str.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function render(players, query) {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = players.length;
  
  if (players.length === 0) {
    grid.innerHTML = '<div class="empty">No players found for "<strong>' + query + '</strong>"</div>';
    return;
  }

  grid.innerHTML = players.map(p => {
    const displayName = (p.firstName ? '<span class="first">' + p.firstName + '</span> ' : '') + p.lastName;
    
    return `
      <div class="card">
        <div class="info">
          <div class="player-name">${displayName}</div>
          <div class="number-position">
            ${p.number !== '-' ? '<span class="number">#' + p.number + '</span> • ' : ''}
            <span>${p.position || 'Unknown'}</span>
          </div>
        </div>
        <span class="club-badge" style="background: ${getClubColor(p.team)}; color: #fff;">${p.team}</span>
      </div>`;
  }).join('');
}

render(PLAYERS, '');

document.getElementById('searchInput').addEventListener('input', function() {
  const q = normalizeStr(this.value.trim());
  if (!q) {
    document.getElementById('meta').innerHTML = 'Showing all <strong id="count">0</strong> players';
    render(PLAYERS, '');
    return;
  }
  
  const filtered = PLAYERS.filter(p =>
    normalizeStr(p.name).includes(q) ||
    normalizeStr(p.team).includes(q) ||
    normalizeStr(p.position).includes(q)
  );
  
  document.getElementById('meta').innerHTML = `Found <strong id="count">0</strong> players for "<em>${this.value}</em>"`;
  render(filtered, this.value.trim());
});
</script>
